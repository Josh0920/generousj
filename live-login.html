<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GJP Live Login</title>
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      margin: 0;
      padding: 40px;
      background: #fff;
      color: #111;
    }
    .card {
      max-width: 420px;
      margin: 0 auto;
      border: 1px solid #e5e5e5;
      border-radius: 14px;
      padding: 22px;
    }
    h2 { margin-top: 0; }
    label { display: block; margin: 14px 0 6px; }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 15px;
    }
    button {
      margin-top: 16px;
      width: 100%;
      padding: 10px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
    }
    .err {
      color: #b00020;
      margin-top: 12px;
      font-size: 14px;
    }
    .muted {
      font-size: 13px;
      color: #666;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Live Editor Login</h2>
    <div class="muted">This login is for Live Update editors only.</div>

    <label>Email</label>
    <input id="email" type="email" autocomplete="email" />

    <label>Password</label>
    <input id="password" type="password" autocomplete="current-password" />

    <button id="loginBtn">Sign In</button>

    <div id="msg" class="err"></div>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const supabase = createClient(
      "SUPABASE_URL",
      "SUPABASE_ANON_KEY"
    );

    const $ = (id) => document.getElementById(id);

    $("loginBtn").addEventListener("click", async () => {
      $("msg").textContent = "";

      const email = $("email").value.trim();
      const password = $("password").value;

      if (!email || !password) {
        $("msg").textContent = "Enter email and password.";
        return;
      }

      const { data, error } = await supabase.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        $("msg").textContent = error.message;
        return;
      }

      const userId = data.user.id;

      const { data: profile, error: pErr } = await supabase
        .from("profiles")
        .select("role")
        .eq("id", userId)
        .single();

      if (pErr || !profile) {
        await supabase.auth.signOut();
        $("msg").textContent = "Profile not found.";
        return;
      }

      // 🔐 Enforce LIVE role only
      if (profile.role !== "live") {
        await supabase.auth.signOut();
        $("msg").textContent = "This login is for Live editors only.";
        return;
      }

      // ✅ Success
      window.location.href = "/live-admin.html";
    });
  </script>

</body>
</html>
